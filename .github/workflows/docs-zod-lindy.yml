name: Docs — Zod + Lindy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate OpenAPI spec
        run: npm run docs:generate

      - name: Validate spec
        run: npx @redocly/cli lint openapi.json --skip-rule=no-empty-servers

      - name: Commit updated spec
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: regenerate openapi spec'
          file_pattern: openapi.json

      # Add LINDY_WEBHOOK_URL to your repo secrets to enable this step
      - name: Notify Lindy
        env:
          LINDY_WEBHOOK_URL: ${{ secrets.LINDY_WEBHOOK_URL }}
        run: |
          if [ -z "$LINDY_WEBHOOK_URL" ]; then
            echo "LINDY_WEBHOOK_URL not set, skipping"
            exit 0
          fi
          SPEC_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/openapi.json"
          curl -s -X POST "$LINDY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"specUrl\": \"$SPEC_URL\", \"service\": \"test-api\", \"commit\": \"${{ github.sha }}\"}"
